# STOMP WebSocket Configuration
spring.websocket.sockjs.heartbeat-time=25000
spring.websocket.stomp.broker.heartbeat.send-interval=25000
spring.websocket.stomp.broker.heartbeat.receive-interval=25000

# Message size limits for STOMP
spring.websocket.stomp.max-text-message-size=2097152
spring.websocket.stomp.max-binary-message-size=2097152
spring.websocket.stomp.max-message-buffer-size=2097152

# File Transfer Configuration
file.transfer.max-file-size=2147483648
file.transfer.max-total-size=2147483648
file.transfer.chunk-size=65536
file.transfer.max-concurrent=3
file.transfer.temp-dir=${java.io.tmpdir}
file.transfer.throttle-bytes-per-second=10485760

# Spring Boot Multipart Configuration
spring.servlet.multipart.max-file-size=2147483648
spring.servlet.multipart.max-request-size=2147483648
spring.servlet.multipart.file-size-threshold=10240
spring.servlet.multipart.enabled=true
spring.servlet.multipart.resolve-lazily=false

# Additional Tomcat multipart limits
server.tomcat.max-http-form-post-size=2147483648
server.tomcat.max-swallow-size=2147483648

# Default logging configuration (environment-specific settings below)
logging.level.org.springframework.messaging=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.com.fufu.terminal=INFO
logging.level.org.springframework.messaging.simp=INFO
logging.level.org.springframework.web.socket.sockjs=INFO
# 敏感信息过滤，避免密码等信息泄露到日志
logging.level.com.fufu.terminal.config.StompAuthenticationInterceptor=WARN

# Security Configuration Defaults
# SSH严格主机密钥检查（生产环境应设置为true）
terminal.security.strict-host-checking=true
# 允许的WebSocket来源（为空时允许所有来源，适用于开发环境）
terminal.security.allowed-origins=

# Rate Limiting Configuration (for future enhancement)
terminal.rate-limit.connections-per-minute=10
terminal.rate-limit.enabled=false

# --- Profile-Specific Configuration ---

# Development Profile
---
spring.config.activate.on-profile=dev
logging.level.com.fufu.terminal=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG
# 开发环境关闭严格主机检查，便于测试
terminal.security.strict-host-checking=false
# 开发环境允许所有来源
terminal.security.allowed-origins=
# 开发环境启用详细调试日志
logging.level.com.fufu.terminal.config.StompAuthenticationInterceptor=DEBUG
# 开发环境放宽文件传输限制
file.transfer.max-file-size=2147483648
file.transfer.max-total-size=4294967296

# Test Profile
---
spring.config.activate.on-profile=test
logging.level.com.fufu.terminal=DEBUG
terminal.security.strict-host-checking=false
terminal.security.allowed-origins=
# 测试环境使用更短的令牌TTL（便于测试）
terminal.security.token-ttl-seconds=60
# 测试环境使用较小的文件传输限制
file.transfer.max-file-size=52428800
file.transfer.max-total-size=104857600

# Production Profile
---
spring.config.activate.on-profile=prod
# 生产环境使用INFO级别日志，避免性能影响
logging.level.org.springframework.messaging=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.com.fufu.terminal=INFO
logging.level.com.fufu.terminal.config.StompAuthenticationInterceptor=WARN
# 生产环境启用严格主机检查
terminal.security.strict-host-checking=true
# 生产环境限制允许的来源（需要根据实际部署域名配置）
terminal.security.allowed-origins=https://your-domain.com,https://staging.your-domain.com
# 生产环境启用连接限制
terminal.rate-limit.enabled=true
terminal.rate-limit.connections-per-minute=5
# 生产环境严格的文件传输限制
file.transfer.max-file-size=52428800
file.transfer.max-total-size=209715200
file.transfer.throttle-bytes-per-second=5242880
