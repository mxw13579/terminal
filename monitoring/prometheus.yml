global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'terminal-application-monitor'

rule_files:
  # - "alert_rules.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s
    metrics_path: /metrics

  # Terminal application backend monitoring
  - job_name: 'terminal-backend'
    static_configs:
      - targets: ['backend:8100']
    scrape_interval: 15s
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    honor_labels: true
    params:
      format: ['prometheus']

  # Optional: Nginx proxy monitoring (if nginx-prometheus-exporter is added)
  - job_name: 'nginx-proxy'
    static_configs:
      - targets: ['nginx-proxy:9113']
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s

  # System monitoring using node-exporter (optional)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s

  # Container monitoring using cAdvisor (optional)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s

  # SSH Terminal specific metrics
  - job_name: 'terminal-health'
    static_configs:
      - targets: ['backend:8100']
    scrape_interval: 30s
    metrics_path: /actuator/health
    scrape_timeout: 10s
    params:
      format: ['prometheus']

# Alerting configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Remote write configuration (optional for external monitoring systems)
# remote_write:
#   - url: "https://your-remote-prometheus-endpoint/api/v1/write"
#     write_relabel_configs:
#       - source_labels: [__name__]
#         regex: 'terminal_.*'
#         action: keep

# Remote read configuration (optional)
# remote_read:
#   - url: "https://your-remote-prometheus-endpoint/api/v1/read"

# Storage configuration
storage:
  tsdb:
    retention.time: 15d
    retention.size: 10GB